services:
  postgres:
    image: postgres:15-bullseye
    container_name: projectmanagement_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 165050
      POSTGRES_DB: projectmanagement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: